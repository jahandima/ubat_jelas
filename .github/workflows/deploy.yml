name: Deploy UbatJelas

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lambda runtime is python3.12, so build with the same version.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Verify AWS account
        run: aws sts get-caller-identity

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template infra/template.yaml --base-dir .

      - name: Check package size
        run: |
          du -sh .aws-sam/build/UbatJelasFunction
          du -sh .aws-sam/build/UbatJelasFunction/* | sort -h | tail -8

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ubatjelas \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides LlamaCloudApiKey=${{ secrets.LLAMA_CLOUD_API_KEY }}

      - name: Read stack outputs
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name ubatjelas \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          FRONTEND_URL=$(aws cloudformation describe-stacks --stack-name ubatjelas \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ubatjelas \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks --stack-name ubatjelas \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "cf_dist_id=$CF_DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Inject API URL into frontend
        run: |
          sed -i "s|__API_URL_PLACEHOLDER__|${{ steps.outputs.outputs.api_url }}|g" frontend/index.html

      - name: Upload frontend
        run: |
          aws s3 cp frontend/index.html "s3://${{ steps.outputs.outputs.bucket_name }}/index.html" \
            --content-type text/html \
            --cache-control "max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.cf_dist_id }}" \
            --paths "/index.html" "/"

      - name: Print URLs
        run: |
          echo "✅ API URL: ${{ steps.outputs.outputs.api_url }}"
          echo "✅ Frontend URL: ${{ steps.outputs.outputs.frontend_url }}"